<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Add Unit

    </title>

    <!-- =====================================================
                        FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- =====================================================
                        PAGE STYLE
    ====================================================== -->

    <style>

        /* =====================================================
                            RESET
        ====================================================== */

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

        }

        :root{

            --primary:#2563eb;
            --primary-hover:#1d4ed8;
            --background:#f5f7fb;
            --white:#ffffff;
            --text:#111827;
            --muted:#6b7280;
            --border:#d1d5db;
            --border-light:#e5e7eb;
            --shadow:0 2px 12px rgba(0,0,0,.05);
            --radius:14px;

        }

        body{

            background:var(--background);

            font-family:"Segoe UI",sans-serif;

            color:var(--text);

        }

        a{

            text-decoration:none;

        }

        button{

            cursor:pointer;

            font-family:inherit;

        }

        input,

        textarea{

            font-family:inherit;

        }

        /* =====================================================
                        MAIN CONTAINER
        ====================================================== */

        .container{

            width:94%;

            max-width:1100px;

            margin:35px auto;

        }

        /* =====================================================
                        PAGE HEADER
        ====================================================== */

        .page-header{

            display:flex;

            justify-content:space-between;

            align-items:flex-start;

            gap:20px;

            margin-bottom:30px;

        }

        .page-title h1{

            font-size:32px;

            margin-bottom:6px;

        }

        .page-title p{

            color:var(--muted);

            font-size:15px;

        }

        /* =====================================================
                        BUTTONS
        ====================================================== */

        .btn{

            height:44px;

            padding:0 20px;

            border:none;

            border-radius:10px;

            display:inline-flex;

            align-items:center;

            justify-content:center;

            gap:8px;

            font-size:14px;

            font-weight:600;

            transition:.25s;

        }

        .btn-primary{

            background:var(--primary);

            color:#ffffff;

        }

        .btn-primary:hover{

            background:var(--primary-hover);

        }

        /* =====================================================
                        FORM CARD
        ====================================================== */

        .form-card{

            background:#ffffff;

            border-radius:14px;

            overflow:hidden;

            box-shadow:var(--shadow);

        }

        .form-header{

            padding:25px 30px;

            border-bottom:1px solid var(--border-light);

        }

        .form-header h2{

            font-size:24px;

            margin-bottom:6px;

        }

        .form-header p{

            color:var(--muted);

            font-size:14px;

        }

        .form-body{

            padding:30px;

        }

        .form-grid{

            display:grid;

            gap:25px;

        }

        .form-group{

            display:flex;

            flex-direction:column;

        }

        .form-group label{

            font-size:14px;

            font-weight:600;

            margin-bottom:8px;

        }

        .required{

            color:#dc2626;

        }

        .form-control{

            width:100%;

            height:48px;

            border:1px solid var(--border);

            border-radius:10px;

            padding:0 15px;

            font-size:14px;

            outline:none;

            transition:.25s;

        }

        .form-control:focus{

            border-color:var(--primary);

            box-shadow:0 0 0 3px rgba(37,99,235,.10);

        }

        textarea.form-control{

            height:140px;

            resize:vertical;

            padding:14px 15px;

        }
                /* =====================================================
                        STATUS SWITCH
        ====================================================== */

        .status-box{

            display:flex;

            align-items:center;

            gap:15px;

            height:48px;

        }

        .status-text{

            font-size:14px;

            font-weight:500;

            color:var(--text);

        }

        .switch{

            position:relative;

            display:inline-block;

            width:56px;

            height:30px;

        }

        .switch input{

            display:none;

        }

        .slider{

            position:absolute;

            inset:0;

            background:#d1d5db;

            border-radius:30px;

            transition:.3s;

        }

        .slider::before{

            content:"";

            position:absolute;

            width:24px;

            height:24px;

            left:3px;

            top:3px;

            background:#ffffff;

            border-radius:50%;

            transition:.3s;

        }

        .switch input:checked + .slider{

            background:var(--primary);

        }

        .switch input:checked + .slider::before{

            transform:translateX(26px);

        }
                /* =====================================================
                        FORM FOOTER
        ====================================================== */

        .form-footer{

            display:flex;

            justify-content:flex-end;

            align-items:center;

            gap:15px;

            padding:25px 30px;

            border-top:1px solid var(--border-light);

            background:#fafafa;

        }

        /* =====================================================
                        BUTTON STYLES
        ====================================================== */

        .btn-secondary{

            background:#ffffff;

            color:#374151;

            border:1px solid var(--border);

        }

        .btn-secondary:hover{

            background:#f3f4f6;

        }

        .btn-success{

            background:var(--primary);

            color:#ffffff;

        }

        .btn-success:hover{

            background:var(--primary-hover);

        }

        /* =====================================================
                        RESPONSIVE
        ====================================================== */

        @media(max-width:768px){

            .container{

                width:96%;

                margin:20px auto;

            }

            .page-header{

                flex-direction:column;

                align-items:flex-start;

            }

            .page-title h1{

                font-size:26px;

            }

            .form-header,

            .form-body,

            .form-footer{

                padding:20px;

            }

            .form-footer{

                flex-direction:column-reverse;

                align-items:stretch;

            }

            .form-footer .btn{

                width:100%;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- =====================================================
                        PAGE HEADER
    ====================================================== -->

    <div class="page-header">

        <div class="page-title">

           <h1>

    {{ title }}

</h1>

            <p>

               {% if title == "Edit Unit" %}

Update an existing inventory unit.

{% else %}

Create a new inventory unit.

{% endif %}

            </p>

        </div>

        <a

            href="{% url 'inventory:unit_list' %}"

            class="btn btn-primary"

        >

            <i class="fa-solid fa-arrow-left"></i>

            Unit List

        </a>

    </div>

    <!-- =====================================================
                        UNIT FORM
    ====================================================== -->

    <form method="POST">

    {% csrf_token %}

        <div class="form-card">

            <div class="form-header">

                <h2>

                    Unit Information

                </h2>

                <p>

                    Fill in the unit details below.

                </p>

            </div>

            <div class="form-body">

                <div class="form-grid">
                                  <!-- =====================================================
                                UNIT NAME
                ====================================================== -->

                <div class="form-group">

                    <label>

                        Unit Name

                        <span class="required">*</span>

                    </label>

                    {{ form.name }}

                </div>



                <!-- =====================================================
                                SHORT NAME
                ====================================================== -->

                <div class="form-group">

                    <label>

                        Short Name

                        <span class="required">*</span>

                    </label>

                    {{ form.short_name }}

                </div>



                <!-- =====================================================
                                DESCRIPTION
                ====================================================== -->

                <div class="form-group">

                    <label>

                        Description

                    </label>

                   {{ form.description }}

                </div>



                <!-- =====================================================
                                STATUS
                ====================================================== -->

                <div class="form-group">

                    <label>

                        Status

                    </label>

                    <div class="status-box">

                        <label class="switch">

                            {{ form.is_active }}

                            <span class="slider"></span>

                        </label>

                        <span class="status-text">

                            Active Unit

                        </span>

                    </div>

                </div>

            </div>

        </div>
                    <!-- =====================================================
                            FORM FOOTER
            ====================================================== -->

            <div class="form-footer">

                <a

                    href="{% url 'inventory:unit_list' %}"

                    class="btn btn-secondary"

                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Cancel

                </a>

                <button

                    type="submit"

                    class="btn btn-success"

                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    {% if title == "Edit Unit" %}

Update Unit

{% else %}

Save Unit

{% endif %}

                </button>

            </div>

        </div>

    </form>

</div>

<!-- =====================================================
                    PAGE SCRIPT
====================================================== -->

<script>

    document.addEventListener(

        "DOMContentLoaded",

        function(){

            const unitName = document.querySelector(

                ".form-control"

            );

            if(unitName){

                unitName.focus();

            }

        }

    );

</script>

</body>

</html>
